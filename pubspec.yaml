name: light_result
description: "A lightweight, zero-dependency functional error handling package for Dart 3. Built with sealed classes and pattern matching."
version: 0.1.1
homepage: https://github.com/mstdeveloper33/light_result
repository: https://github.com/mstdeveloper33/light_result
issue_tracker: https://github.com/mstdeveloper33/light_result/issues

license: MIT

topics:
  - functional-programming
  - error-handling
  - result-type
  - either
  - monad

environment:
  sdk: ^3.10.4

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.0

dependencies:
  matcher: ^0.12.0
